# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Publish app (FolderProfile)
      run: dotnet publish MiHotKeyApp/MiHotKeyApp.csproj -c Release /p:PublishProfile=FolderProfile
    - name: Upload publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiHotKeyApp-win-x86-publish
        path: MiHotKeyApp/bin/Release/net8.0-windows/publish/win-x86/
